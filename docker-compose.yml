services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nutripilot
      POSTGRES_PASSWORD: nutripilot
      POSTGRES_DB: nutripilot
    ports:
      - "5488:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutripilot"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8099:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://nutripilot:nutripilot@db:5432/nutripilot
      JWT_SECRET: dev-secret-change-in-production
      API_KEY: dev-api-key-change-in-production
      CORS_ORIGINS: http://localhost:3000,http://localhost:3099,https://nutripilot.pineappleles.ch
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "3099:3000"
    # API calls use relative URLs proxied via Next.js rewrites — no NEXT_PUBLIC_API_URL needed
    depends_on:
      - api

volumes:
  pgdata:
