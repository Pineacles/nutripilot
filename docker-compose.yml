services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nutripilot
      POSTGRES_PASSWORD: nutripilot
      POSTGRES_DB: nutripilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutripilot"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://nutripilot:nutripilot@db:5432/nutripilot
      JWT_SECRET: dev-secret-change-in-production
      API_KEY: dev-api-key-change-in-production
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  pgdata:
