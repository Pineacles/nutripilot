services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nutripilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nutripilot}
    ports:
      - "127.0.0.1:5488:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nutripilot}"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8099:8000"
    environment:
      # "dev" by default; set ENVIRONMENT=production in .env when this compose
      # file backs a real deployment (enforces secret validation, hides /docs).
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://nutripilot:nutripilot@db:5432/nutripilot}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      # Falls back to the same dev-only key hardcoded in app/config.py so local
      # dev works out of the box; override in .env to test rotation locally.
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-sx9C_xR4WKwZa-JGiJ8xy4eZW5OxMkauVGVWpPuDb1A=}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      USDA_API_KEY: ${USDA_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app:z
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:3099:3000"
    # API calls use relative URLs proxied via Next.js rewrites — no NEXT_PUBLIC_API_URL needed
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
