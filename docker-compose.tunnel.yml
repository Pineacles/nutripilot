# For use with Cloudflare Tunnel: expose only port 3000.
# Next.js proxies /api/* to the backend internally.
#
# 1. Copy .env.example to .env and fill in values
# 2. docker compose -f docker-compose.tunnel.yml up -d --build
# 3. Point your Cloudflare Tunnel to http://localhost:3000

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nutripilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nutripilot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nutripilot}"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"]
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nutripilot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nutripilot}
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?Set TOKEN_ENCRYPTION_KEY in .env (see .env.example for the generation command)}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env to your real frontend origin(s)}
      USDA_API_KEY: ${USDA_API_KEY:-}
      SEED_EMAIL: ${SEED_EMAIL:-admin@nutripilot.dev}
      SEED_PASSWORD: ${SEED_PASSWORD:?Set SEED_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      INTERNAL_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
