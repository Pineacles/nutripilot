# For use with Cloudflare Tunnel — expose only port 3000.
# Next.js proxies /api/* to the backend internally.
#
# 1. Copy .env.example to .env and fill in values
# 2. docker compose -f docker-compose.tunnel.yml up -d --build
# 3. Point your Cloudflare Tunnel to http://localhost:3000

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-nutripilot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-nutripilot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nutripilot}"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-nutripilot}:${DB_PASSWORD}@db:5432/${DB_NAME:-nutripilot}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://nutripilot.example.com}
      USDA_API_KEY: ${USDA_API_KEY:-}
      SEED_EMAIL: ${SEED_EMAIL:-admin@nutripilot.dev}
      SEED_PASSWORD: ${SEED_PASSWORD:-nutripilot}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      INTERNAL_API_URL: http://api:8000
    depends_on:
      - api

volumes:
  pgdata:
