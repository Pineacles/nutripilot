name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Run pytest
        working-directory: backend
        env:
          JWT_SECRET: "ci-test-secret-not-for-production"
          API_KEY: "ci-test-api-key-not-for-production"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          # Fixed Fernet key so the (skippable) migration-parity test and any
          # other code path that touches encryption has a valid key even
          # though tests/conftest.py already hardcodes its own for the
          # in-process suite. Generated once for CI; not used anywhere real.
          TOKEN_ENCRYPTION_KEY: "rJ-jlhtfecSO3n6vDuuW4_klzcmr9T2dLHI9-NZb2MQ="
        run: pytest --tb=short -q

  frontend-lint-build:
    name: Frontend Lint + Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
